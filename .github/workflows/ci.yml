name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: critique
          POSTGRES_PASSWORD: critique
          POSTGRES_DB: critique
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://critique:critique@localhost:5432/critique
      ANTHROPIC_API_KEY: test_key
      OPENAI_API_KEY: test_key
      LLM_PROVIDER: anthropic
      HUMAN_IN_LOOP: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt aiosqlite

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v --tb=short
